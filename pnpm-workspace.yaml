packages:
  - packages/*

allowBuilds:
  '@swc/core': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  nx: true

autoInstallPeers: true

# monaco-editor pins a DOMPurify release with a known ALLOWED_ATTR pollution
# advisory; the override keeps the patched line until monaco ships it.
overrides:
  dompurify: ^3.4.13

ignoredBuiltDependencies:
  - nx

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
