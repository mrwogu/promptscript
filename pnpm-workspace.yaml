packages:
  - packages/*

allowBuilds:
  '@swc/core': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  nx: true

autoInstallPeers: true

# Keep transitive dependencies on patched releases until their parents update.
# monaco-editor pins a DOMPurify release with a known ALLOWED_ATTR pollution
# advisory; the override keeps the patched line until monaco ships it.
overrides:
  '@xhmikosr/decompress@11.1.1': 11.1.3
  axios@1.16.0: 1.18.0
  brace-expansion@2.1.1: 2.1.4
  brace-expansion@5.0.6: 5.0.9
  dompurify: ^3.4.13
  fast-uri@3.1.0: 3.1.5
  fast-uri@3.1.2: 3.1.5
  find-my-way@9.5.0: 9.7.0
  form-data@4.0.5: 4.0.6
  piscina@4.9.2: 4.9.3
  qs@6.14.2: 6.15.3
  tmp@0.2.6: 0.2.7
  undici@6.26.0: 6.28.0
  undici@7.27.2: 7.29.0

ignoredBuiltDependencies:
  - nx

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
