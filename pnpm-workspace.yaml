packages:
  - packages/*
  - apps/docs

allowBuilds:
  '@swc/core': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  nx: true

autoInstallPeers: true

# Keep transitive dependencies on patched releases until their parents update.
# monaco-editor pins a DOMPurify release with a known ALLOWED_ATTR pollution
# advisory; the override keeps the patched line until monaco ships it.
overrides:
  '@xhmikosr/decompress@>=11.0.0 <11.1.4': ^11.1.4
  axios@>=1.0.0 <1.20.0: ^1.20.0
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  dompurify: ^3.4.13
  fast-uri@<3.1.6: ^3.1.6
  fast-uri@>=4.0.0 <4.1.5: ^4.1.5
  find-my-way@9.5.0: 9.7.0
  form-data@4.0.5: 4.0.6
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  piscina@4.9.2: 4.9.3
  qs@<6.16.0: ^6.16.0
  smol-toml@<1.7.1: ^1.7.1
  tmp@0.2.6: 0.2.7
  undici@>=6.0.0 <6.28.1: ^6.28.1
  undici@7.27.2: 7.29.0

ignoredBuiltDependencies:
  - nx

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
