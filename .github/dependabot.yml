version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'

  # Phoenix image of the OpenTelemetry example (pinned by digest)
  - package-ecosystem: 'docker-compose'
    directory: '/examples/runtime-otel/phoenix'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'

  # Langfuse and the stores it runs on, for the OpenTelemetry example (pinned by digest).
  # One group, so the web and worker images move together. Major versions stay manual.
  - package-ecosystem: 'docker-compose'
    directory: '/examples/runtime-otel/langfuse'
    schedule:
      interval: 'monthly'
    groups:
      langfuse:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'

  # OpenTelemetry packages of the example (own lockfile, not a workspace member)
  - package-ecosystem: 'npm'
    directory: '/examples/runtime-otel'
    schedule:
      interval: 'monthly'
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'
