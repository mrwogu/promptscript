name: Deploy Documentation

# Docs are unversioned and served from the site root. They track the latest
# release: tag pushes and manual runs rebuild docs + /playground. Pushes to
# main only refresh /playground-dev. Legacy /latest/, /dev/ and /vX.Y/ URLs
# are 301-redirected to the root by Cloudflare redirect rules.

on:
  push:
    branches: [main]
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # One shared group: every run uploads a full gh-pages snapshot, so runs must
  # not overlap or an older snapshot could be deployed after a newer one.
  # GitHub keeps only one pending run per group, so a tag run still
  # waiting in the queue can be replaced by a newer main push. Rerun it then.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip main-branch push when release-please just created a tag on the same commit.
    # The tag-push run deploys docs AND refreshes /playground-dev, so the main run is redundant.
    if: >-
      github.event_name != 'push'
      || !startsWith(github.ref, 'refs/heads/')
      || !startsWith(github.event.head_commit.message, 'chore(main): release')
    env:
      IS_RELEASE: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Generate JSON Schema
        if: env.IS_RELEASE == 'true'
        run: pnpm schema:generate

      - name: Generate API documentation
        if: env.IS_RELEASE == 'true'
        run: pnpm docs:generate

      - name: Copy schema to docs
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p docs/schema
          cp schema/config.json docs/schema/config.json
          mkdir -p docs/schema/diff
          cp schema/diff-v1.json docs/schema/diff/v1.json

      - name: Setup Python
        if: env.IS_RELEASE == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs dependencies
        if: env.IS_RELEASE == 'true'
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        if: env.IS_RELEASE == 'true'
        run: mkdocs build
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.MKDOCS_GIT_COMMITTERS_APIKEY }}
          PYTHONPATH: ${{ github.workspace }}

      - name: Build playground
        run: pnpm nx build playground

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # gh-pages keeps the last deployed state, so a main push (playground-dev
      # only) does not wipe the docs built from the latest release.
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-content

      - name: Update site content
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            # --delete also removes the old mike version dirs (latest, dev, vX.Y)
            rsync -a --delete \
              --exclude .git --exclude /playground --exclude /playground-dev \
              site/ gh-pages-content/
            rm -rf gh-pages-content/playground
            cp -r dist/packages/playground gh-pages-content/playground
          fi
          rm -rf gh-pages-content/playground-dev
          cp -r dist/packages/playground gh-pages-content/playground-dev

      - name: Commit and push gh-pages
        working-directory: gh-pages-content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" || echo "No changes to commit"

          # Retry push up to 3 times to handle concurrent gh-pages pushes
          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              break
            fi
            echo "Push failed (attempt $attempt), rebasing and retrying..."
            git pull --rebase origin gh-pages
            sleep 5
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages-content

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
