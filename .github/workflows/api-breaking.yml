name: API Breaking Check

on:
  pull_request:
    branches: [main]
    # edited: a fixed title runs the check again with the new title
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  api-breaking:
    name: API Breaking Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # The base is the merge base with origin/main
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # The job runs code from the pull request and needs no token after checkout
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the breaking change check
        run: pnpm exec vitest run --dir scripts

      - name: API Breaking Check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! pnpm api:breaking; then
            echo "::error::Breaking change in an API report or schema, see the log above. Mark the pull request as breaking or undo the change."
            exit 1
          fi
